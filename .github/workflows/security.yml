name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Run daily at midnight UTC
    - cron: '0 0 * * *'
  workflow_dispatch:

# Read-only token (#116).
permissions:
  contents: read

# A new push on the same branch/PR cancels the previous run (#124).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master 2026-10-09
        with:
          toolchain: stable

      # Prebuilt binary instead of `cargo install cargo-audit` (3-5 min per
      # daily run, #124).
      - name: Install cargo-audit
        uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2.87.27
        with:
          tool: cargo-audit

      - name: Run cargo audit
        # `--deny warnings` turns unmaintained/unsound/yanked advisories into
        # failures, the same gate as deny.toml (`[advisories] version = 2`):
        # without it `cargo audit` only fails on vulnerabilities and the
        # ignores below would be decorative (#124).
        #
        # Unmaintained-only advisories with no fixed release (mirrored in
        # deny.toml, with their dependency chains). Reviewed: 2026-10-11.
        # RUSTSEC-2024-0384: instant unmaintained (transitive via notify -> notify-types)
        # RUSTSEC-2024-0436: paste unmaintained (transitive via tokenizers -> macro_rules_attribute)
        # RUSTSEC-2025-0119: number_prefix unmaintained (transitive via tokenizers -> indicatif)
        run: cargo audit --deny warnings --ignore RUSTSEC-2024-0384 --ignore RUSTSEC-2024-0436 --ignore RUSTSEC-2025-0119

  deny:
    name: Dependency Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master 2026-10-09
        with:
          toolchain: stable

      - name: Install cargo-deny
        uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2.87.27
        with:
          tool: cargo-deny

      - name: Check dependencies
        run: cargo deny check
