name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # The archives and the npm package are named after the tag, while the binary
  # reports the version compiled from Cargo.toml: a mismatch makes every MCP
  # session log "Update available" and `semantiq update` reinstall the same
  # release forever. Fail before building anything.
  check-version:
    name: Check tag matches versions
    runs-on: ubuntu-latest
    # Only reads the repository; the workflow default is `contents: write`.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Compare the tag with Cargo.toml, npm/package.json and the plugin manifests
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME#v}"
          CARGO=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "semantiq") | .version')
          NPM=$(jq -r '.version' npm/package.json)
          PLUGIN=$(jq -r '.version' .claude-plugin/plugin.json)
          MARKETPLACE=$(jq -r '.plugins[] | select(.name == "semantiq") | .version' .claude-plugin/marketplace.json)
          echo "tag ${GITHUB_REF_NAME} -> ${TAG}"
          echo "Cargo.toml (workspace):          ${CARGO}"
          echo "npm/package.json:                ${NPM}"
          echo ".claude-plugin/plugin.json:      ${PLUGIN}"
          echo ".claude-plugin/marketplace.json: ${MARKETPLACE}"
          STATUS=0
          for entry in "Cargo.toml=${CARGO}" "npm/package.json=${NPM}" \
                       ".claude-plugin/plugin.json=${PLUGIN}" ".claude-plugin/marketplace.json=${MARKETPLACE}"; do
            FILE="${entry%%=*}"
            VERSION="${entry#*=}"
            if [ "${VERSION}" != "${TAG}" ]; then
              echo "::error::${FILE} declares version ${VERSION} but the tag is ${GITHUB_REF_NAME}"
              STATUS=1
            fi
          done
          if [ "${STATUS}" -ne 0 ]; then
            echo "::error::Tag/version mismatch: bump the version in Cargo.toml, npm/package.json, .claude-plugin/plugin.json and .claude-plugin/marketplace.json together (see CLAUDE.md, Releasing), then re-tag."
            exit 1
          fi
          echo "All version files match tag ${GITHUB_REF_NAME}."

  build:
    name: Build ${{ matrix.target }}
    needs: check-version
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        # `onnx` (real embeddings) is a default feature; `cargo_flags` only
        # opts out where ONNX Runtime has no prebuilt binaries.
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
            cargo_flags: ""
          # ort ships no ONNX Runtime for macOS Intel: stub embeddings
          # (semantic search disabled, reported at startup and in `stats`).
          - target: x86_64-apple-darwin
            os: macos-15
            cargo_flags: "--no-default-features"
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            cargo_flags: ""
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            cargo_flags: ""
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            cargo_flags: ""

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-compilation tools (Linux ARM64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu

      - name: Build
        run: cargo build --release --target ${{ matrix.target }} ${{ matrix.cargo_flags }}
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
          CXX_aarch64_unknown_linux_gnu: aarch64-linux-gnu-g++

      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          cd target/${{ matrix.target }}/release
          ARCHIVE="semantiq-${{ github.ref_name }}-${{ matrix.target }}.tar.gz"
          tar -czvf "../../../$ARCHIVE" semantiq
          cd ../../..
          # Sidecar in standard `sha256sum` format: "<hex>  <filename>".
          shasum -a 256 "$ARCHIVE" > "$ARCHIVE.sha256"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cd target/${{ matrix.target }}/release
          $name = "semantiq-${{ github.ref_name }}-${{ matrix.target }}.tar.gz"
          tar -czvf "../../../$name" semantiq.exe
          cd ../../..
          # Same `sha256sum` format as Unix: lowercase hex, two spaces, filename, ASCII/no BOM.
          $hash = Get-FileHash -Algorithm SHA256 -Path $name
          "$("{0}  {1}" -f $hash.Hash.ToLower(), $name)" | Out-File -Encoding ascii -NoNewline "$name.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: semantiq-${{ matrix.target }}
          path: |
            semantiq-*.tar.gz
            semantiq-*.tar.gz.sha256

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - name: Download all artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@26994186c0ac3ef5cae75ac16aa32e8153525f77 # v1
        with:
          files: |
            artifacts/**/*.tar.gz
            artifacts/**/*.tar.gz.sha256
          generate_release_notes: true

  publish-npm:
    name: Publish to npm
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Update package version
        working-directory: npm
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"
          npm version $VERSION --no-git-tag-version --allow-same-version

      - name: Publish
        working-directory: npm
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

