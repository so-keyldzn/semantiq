name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@ad397744b0d591a723ab90405b7247fac0e6b8db # v2

      # `onnx` is a default feature, but the workspace's tests enable
      # `test-stub` and SEMANTIQ_EMBEDDINGS=stub makes it explicit: the suite
      # never downloads the ~139 MB embedding model.
      - name: Run tests
        run: cargo test --workspace --all-features
        env:
          SEMANTIQ_EMBEDDINGS: stub

      # Opt-out build used on x86_64-apple-darwin (no ONNX Runtime binaries).
      - name: Build without default features (stub embeddings)
        run: cargo build -p semantiq --no-default-features

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@ad397744b0d591a723ab90405b7247fac0e6b8db # v2

      - name: Run clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  npm-test:
    name: npm installer tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'

      # Download helpers of npm/scripts/install.js against a local HTTP server
      # (node --test); the installer itself is never run here.
      - name: Run npm test
        working-directory: npm
        run: npm test

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all --check
