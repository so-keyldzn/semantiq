name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

# Read-only token: nothing here writes to the repository (#116).
permissions:
  contents: read

# A new push on the same branch/PR cancels the previous run (#124).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  # `--locked` on every cargo invocation: a Cargo.toml change without its
  # Cargo.lock update fails here instead of being resolved differently by
  # the release build (#119).
  CARGO_LOCKED: --locked

jobs:
  test:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The binaries ship for the three platforms; platform-specific code
        # (path separators, file watcher backends, self-update swap) is only
        # exercised by running the suite on each of them (#121).
        os: [ubuntu-latest, macos-latest, windows-latest]
        include:
          # The prebuilt ONNX Runtime that `ort` downloads for MSVC is built
          # against the static C++ runtime (libcpmt), while the C++ scanners of
          # the tree-sitter grammars are compiled by `cc` against the dynamic
          # one (msvcprt). In a release build the conflicting symbols are
          # trivial inline accessors that get inlined away, so build.yml links;
          # in an unoptimized test build they are real calls and link.exe
          # fails with LNK2005/LNK1169 (`std::basic_streambuf::gptr`,
          # `std::_Lockit::_Lockit`, ...). Linking the CRT statically makes
          # every object agree with ONNX Runtime (`cc` reads the target feature
          # and switches to /MT).
          - os: windows-latest
            rustflags: -D warnings -C target-feature=+crt-static
    env:
      RUSTFLAGS: ${{ matrix.rustflags || '-D warnings' }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master 2026-10-09
        with:
          toolchain: stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@ad397744b0d591a723ab90405b7247fac0e6b8db # v2

      # `onnx` is a default feature, but the workspace's tests enable
      # `test-stub` and SEMANTIQ_EMBEDDINGS=stub makes it explicit: the suite
      # never downloads the ~139 MB embedding model.
      - name: Run tests
        run: cargo test ${{ env.CARGO_LOCKED }} --workspace --all-features
        env:
          SEMANTIQ_EMBEDDINGS: stub

  # The configuration shipped for x86_64-apple-darwin (no ONNX Runtime
  # binaries): the `cfg(feature = "onnx")` branches selected by
  # `--no-default-features` get their own test and lint pass (#108).
  stub-embeddings:
    name: Tests and clippy (--no-default-features)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master 2026-10-09
        with:
          toolchain: stable
          components: clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@ad397744b0d591a723ab90405b7247fac0e6b8db # v2

      - name: Run clippy without default features
        run: cargo clippy ${{ env.CARGO_LOCKED }} -p semantiq --no-default-features --all-targets -- -D warnings

      - name: Run the binary's tests without default features
        run: cargo test ${{ env.CARGO_LOCKED }} -p semantiq --no-default-features
        env:
          SEMANTIQ_EMBEDDINGS: stub

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master 2026-10-09
        with:
          toolchain: stable
          components: clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@ad397744b0d591a723ab90405b7247fac0e6b8db # v2

      - name: Run clippy
        run: cargo clippy ${{ env.CARGO_LOCKED }} --workspace --all-targets --all-features -- -D warnings

  npm-test:
    name: npm installer tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'

      # Download helpers of npm/scripts/install.js against a local HTTP server
      # (node --test); the installer itself is never run here.
      - name: Run npm test
        working-directory: npm
        run: npm test

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master 2026-10-09
        with:
          toolchain: stable
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all --check
