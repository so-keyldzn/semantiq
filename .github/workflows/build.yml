name: Build

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # `onnx` (real embeddings) is a default feature; `cargo_flags` only
        # opts out where ONNX Runtime has no prebuilt binaries.
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
            cargo_flags: ""
            use_cross: false
          # ort ships no ONNX Runtime for macOS Intel: stub embeddings.
          - target: x86_64-apple-darwin
            os: macos-15
            cargo_flags: "--no-default-features"
            use_cross: false
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            cargo_flags: ""
            use_cross: false
          # Smoke build through cross (stub, as before); release.yml builds this
          # target with ONNX using the native cross linker.
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            cargo_flags: "--no-default-features"
            use_cross: true
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            cargo_flags: ""
            use_cross: false

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross
        if: matrix.use_cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build with cross
        if: matrix.use_cross
        run: cross build --release --target ${{ matrix.target }} ${{ matrix.cargo_flags }}

      - name: Build with cargo
        if: ${{ !matrix.use_cross }}
        run: cargo build --release --target ${{ matrix.target }} ${{ matrix.cargo_flags }}

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: semantiq-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/semantiq${{ runner.os == 'Windows' && '.exe' || '' }}
