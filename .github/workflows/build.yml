name: Build

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

# Read-only token: the artifacts go through upload-artifact, not the
# repository (#116).
permissions:
  contents: read

# A new push on the same branch/PR cancels the previous five builds (#124).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # `onnx` (real embeddings) is a default feature; `cargo_flags` only
        # opts out where ONNX Runtime has no prebuilt binaries.
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
            cargo_flags: ""
            use_cross: false
          # ort ships no ONNX Runtime for macOS Intel: stub embeddings.
          - target: x86_64-apple-darwin
            os: macos-15
            cargo_flags: "--no-default-features"
            use_cross: false
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            cargo_flags: ""
            use_cross: false
          # Smoke build through cross (stub, as before); release.yml builds this
          # target with ONNX using the native cross linker.
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            cargo_flags: "--no-default-features"
            use_cross: true
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            cargo_flags: ""
            use_cross: false

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master 2026-10-09
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@ad397744b0d591a723ab90405b7247fac0e6b8db # v2
        with:
          key: ${{ matrix.target }}

      # Pinned to a commit: the previous `--git` install built and ran
      # upstream HEAD on every push (#116). Bump the rev deliberately.
      - name: Install cross
        if: matrix.use_cross
        run: cargo install cross --locked --git https://github.com/cross-rs/cross --rev 74e99b2223de06166f8cdcc1af7f1308ec52baf4

      # `--locked`: the build fails if Cargo.lock is not the one CI tested (#119).
      - name: Build with cross
        if: matrix.use_cross
        run: cross build --release --locked --target ${{ matrix.target }} ${{ matrix.cargo_flags }}

      - name: Build with cargo
        if: ${{ !matrix.use_cross }}
        run: cargo build --release --locked --target ${{ matrix.target }} ${{ matrix.cargo_flags }}

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: semantiq-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/semantiq${{ runner.os == 'Windows' && '.exe' || '' }}
