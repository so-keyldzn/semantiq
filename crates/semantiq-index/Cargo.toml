[package]
name = "semantiq-index"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
semantiq-parser = { path = "../semantiq-parser" }
semantiq-embeddings = { path = "../semantiq-embeddings" }

rusqlite.workspace = true
sqlite-vec.workspace = true
zerocopy.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true
notify.workspace = true
ignore.workspace = true

[features]
default = []
# Store accessors that only tests need (`get_chunks_by_file`, `needs_full_reindex`,
# `set_parser_version`). Enabled by the dev-dependencies of this crate and of
# semantiq-retrieval, never by a binary.
test-support = []

[dev-dependencies]
# Tests never download the embedding model (see the `test-stub` feature).
semantiq-embeddings = { path = "../semantiq-embeddings", features = ["test-stub"] }
semantiq-index = { path = ".", features = ["test-support"] }
tempfile.workspace = true
