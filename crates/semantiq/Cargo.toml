[package]
name = "semantiq"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
readme.workspace = true

[[bin]]
name = "semantiq"
path = "src/main.rs"

[features]
# Real embeddings (CodeRankEmbed via ONNX Runtime) are on by default. Opt out
# with `--no-default-features` (stub model, semantic search disabled), e.g. on
# x86_64-apple-darwin where `ort` ships no prebuilt runtime.
default = ["onnx"]
onnx = ["semantiq-embeddings/onnx"]

[dependencies]
semantiq-mcp = { path = "../semantiq-mcp" }
semantiq-index = { path = "../semantiq-index" }
semantiq-parser = { path = "../semantiq-parser" }
semantiq-retrieval = { path = "../semantiq-retrieval" }
semantiq-embeddings = { path = "../semantiq-embeddings" }

clap.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
rmcp = { workspace = true, features = ["transport-streamable-http-server"] }
ignore.workspace = true
axum.workspace = true
tower.workspace = true
tower-http.workspace = true

[dev-dependencies]
# Tests never download the embedding model (see the `test-stub` feature).
semantiq-embeddings = { path = "../semantiq-embeddings", features = ["test-stub"] }
tempfile.workspace = true
http-body-util.workspace = true
